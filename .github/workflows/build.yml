name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned SDK packages
        # GitHub's Ubuntu image already has Command-Line Tools and SDK licenses.
        # Do not request the retired legacy "tools" SDK package.
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Build the AArch64 power event listener
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -static -Os -s -Wall -Wextra -Werror -o power-events module/power-events.c
      - name: Build development-signed artifacts and run checks
        run: python scripts/build.py --power-events power-events
      - uses: actions/upload-artifact@v4
        with:
          name: mijia-battery-temperature-ci-development
          path: dist/*
          if-no-files-found: error
